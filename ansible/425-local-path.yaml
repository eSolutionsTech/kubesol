---
- name: Local path provisioner
  hosts: localhost
  gather_facts: false
  connection: local
  vars:

# https://github.com/rancher/local-path-provisioner
    URL: "https://raw.githubusercontent.com/rancher/local-path-provisioner/v0.0.37/deploy/local-path-storage.yaml"

  tasks:
    - name: Install local-path-provisioner
      kubernetes.core.k8s:
        state: present
        src: "{{ URL }}"

    # Upstream local-path is not marked default; demos that omit storageClassName need one.
    - name: List StorageClasses
      kubernetes.core.k8s_info:
        kind: StorageClass
      register: storage_classes

    - name: Clear default annotation on all StorageClasses
      kubernetes.core.k8s:
        state: patched
        kind: StorageClass
        name: "{{ item.metadata.name }}"
        definition:
          metadata:
            annotations:
              storageclass.kubernetes.io/is-default-class: "false"
      loop: "{{ storage_classes.resources }}"
      loop_control:
        label: "{{ item.metadata.name }}"

    - name: Set local-path as the default StorageClass
      kubernetes.core.k8s:
        state: patched
        kind: StorageClass
        name: local-path
        definition:
          metadata:
            annotations:
              storageclass.kubernetes.io/is-default-class: "true"
