---
- name: Uninstall DirectPV
  hosts: localhost
  gather_facts: false
  connection: local
  vars:
    D: "/root/.kubesol"

  tasks:
    - name: List cluster components
      command: hostname
      changed_when: none

    - name: Uninstall DirectPV
      pause:
        prompt: Are you sure? Press return to continue. Press Ctrl+c and then "a" to abort

    - name: Check PVC with directpv-min-io storage class
      shell:
        cmd: kubectl get pvc -A 2>/dev/null | grep directpv-min-io | wc -l | sed -e 's/ //g'
      register: how_many_pvc

    - name: Check PVC
      fail:
        msg: |
            Found {{ how_many_pvc.stdout }} PVC with directpv-min-io storage class
            You will need to manually delete them then re-run this playbook.
      when: how_many_pvc.stdout != "0"

    - name: Uninstall directpv
      shell:
        cmd: kubectl-directpv uninstall && rm -f {{ D }}/.directpv.yaml {{ D }}/.drives.yaml {{ D }}/.drives.init
        removes: "{{ D }}/.directpv.yaml"

    - name: Remove directpv local files
      file:
        path: "{{ item }}"
        state: absent
      loop:
        - "{{ D }}/.drives.init"
        - "{{ D }}/.drives.yaml"
        - "{{ D }}/.directpv.yaml"

# Workers, and single-node hosts marked controller_worker=true.
# Wipe only when directpv_device is set, and never the OS disk.
- name: Cleanup directpv on workers
  hosts: all
  gather_facts: false

  tasks:
    - name: Decide whether this host runs DirectPV cleanup
      set_fact:
        directpv_cleanup_host: >-
          {{ ('worker' in groups and inventory_hostname in groups['worker'])
             or (controller_worker | default(false) | bool) }}

    - name: Identify root disk
      shell: |
        set -euo pipefail
        src=$(findmnt -n -o SOURCE /)
        parent=$(lsblk -no PKNAME "$src" | head -n1 || true)
        if [ -n "$parent" ]; then
          printf '%s\n' "$parent"
        else
          basename "$src" | sed -E 's/p?[0-9]+$//'
        fi
      args:
        executable: /bin/bash
      register: root_disk
      changed_when: false
      when:
        - directpv_cleanup_host | bool
        - directpv_device is defined

    - name: Refuse to wipe the OS disk
      assert:
        that:
          - (root_disk.stdout | trim) | length > 0
          - (directpv_device | regex_replace('^/dev/', '')) != (root_disk.stdout | trim)
        fail_msg: >-
          directpv_device {{ directpv_device }} is the OS disk
          ({{ root_disk.stdout | trim }}); refusing to wipe
      when:
        - directpv_cleanup_host | bool
        - directpv_device is defined

    - name: Umount device
      shell: umount "/dev/{{ directpv_device | regex_replace('^/dev/', '') }}"
      failed_when: false
      when:
        - directpv_cleanup_host | bool
        - directpv_device is defined

    - name: Wipefs
      shell: wipefs -a "/dev/{{ directpv_device | regex_replace('^/dev/', '') }}"
      when:
        - directpv_cleanup_host | bool
        - directpv_device is defined
