---
- name: Install DirectPV
  hosts: localhost
  gather_facts: false
  connection: local
  vars:
    D: "/root/.kubesol"
    bin: "https://github.com/minio/directpv/releases/download/v4.0.19/kubectl-directpv_4.0.19_linux_amd64"

  tasks:
    - name: You need to have kubectl-directpv binary
      get_url:
        url: "{{ bin }}"
        dest: /usr/local/bin/kubectl-directpv
        mode: '0755'

    - name: Creating file .directpv.yaml
      shell:
        cmd: kubectl-directpv install -o yaml >{{ D }}/.directpv.yaml

    - name: Applying .directpv.yaml to k8s
      kubernetes.core.k8s:
        state: present
        src: "{{ D }}/.directpv.yaml"

    - name: Pause for 2 minutes to start directpv pods
      pause:
        minutes: 2

    - name: Creating file .drives.yaml
      shell:
        cmd: kubectl-directpv discover --output-file {{ D }}/.drives.yaml

    - command:
        cmd: cat "{{ D }}/.drives.yaml"
      register: out
      changed_when: none

    - name: Show "{{ D }}/.drives.yaml"
      debug:
        msg: "{{ out.stdout_lines }}"

    - name: Check whether DirectPV drives were already initialized
      stat:
        path: "{{ D }}/.drives.init"
      register: drives_init

    - name: Check .drives.yaml before init
      pause:
        prompt: |
          Review {{ D }}/.drives.yaml (printed above).
          Press return to initialize those drives.
          Press Ctrl+c and then "a" to abort.
      when: not drives_init.stat.exists

    - name: Init using .drives.yaml
      shell:
        cmd: kubectl-directpv init {{ D }}/.drives.yaml --dangerous && touch {{ D }}/.drives.init
      when: not drives_init.stat.exists

