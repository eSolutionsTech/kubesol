---
- name: Install dummy
  hosts: localhost
  gather_facts: false
  connection: local

  tasks:
    - name: Create PVC simple-pod-pvc
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: PersistentVolumeClaim
          metadata:
            name: simple-pod-pvc
            namespace: default
          spec:
            # storageClassName: directpv-min-io  # omit to use the cluster default StorageClass
            accessModes:
              - ReadWriteOnce
            resources:
              requests:
                storage: 10Mi

    - name: Create Pod simple-pod-pvc
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Pod
          metadata:
            name: simple-pod-pvc
            namespace: default
          spec:
            containers:
            - image: vvang/dummy:amd64
              name: c1
              resources:
                requests:
                  cpu: 0.1
                  memory: 10Mi
                limits:
                  cpu: 1
                  memory: 250Mi
              volumeMounts:
                - mountPath: "/data"
                  name: vol1
            volumes:
            - name: vol1
              persistentVolumeClaim:
                claimName: simple-pod-pvc
