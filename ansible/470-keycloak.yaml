---
- name: Install keycloak
  hosts: localhost
  gather_facts: false
  connection: local
  vars:
    NS: "keycloak"
    D: "/root/.kubesol"
    iname: "keycloak"

  tasks:
    - include_tasks: tasks/namespace.yaml

    - name: Create db cluster for keycloak
      kubernetes.core.k8s:
        api_version: v1
        namespace: "{{ NS }}"
        state: present
        src: files/keycloak/keycloak-cnpg.yaml
      register: keycloak_db
      retries: 10
      delay: 20
      until: keycloak_db is succeeded

    - name: Check if keycloak admin secret exists
      kubernetes.core.k8s_info:
        kind: Secret
        namespace: "{{ NS }}"
        name: keycloak
      register: keycloak_admin_secret

    - name: Generate a new password
      shell: pwgen 16 1
      register: new_password
      when: keycloak_admin_secret.resources[0] is undefined

    - name: Reuse the existing admin password
      set_fact:
        admin_password: "{{ keycloak_admin_secret.resources[0].data['admin-password'] | b64decode }}"
      when: keycloak_admin_secret.resources[0] is defined

    - name: Use the generated admin password
      set_fact:
        admin_password: "{{ new_password.stdout }}"
      when: keycloak_admin_secret.resources[0] is undefined

    - name: keycloak template j2 -> yaml
      template:
        src: "files/keycloak/values-keycloak.j2"
        dest: "{{ D }}/.values-keycloak.yaml"

    - name: Add helm repo
      kubernetes.core.helm_repository:
        name: keycloak
        repo_url: https://raw.githubusercontent.com/bitnami/charts/archive-full-index/bitnami

    - name: Install
      kubernetes.core.helm:
        name: keycloak
        chart_ref: keycloak/keycloak
        namespace: "{{ NS }}"
        chart_version: "{{ keycloak_chart_version | default('') }}"
        disable_hook: true
        values_files:
          - "{{ D }}/.values-keycloak.yaml"

    - include_tasks: tasks/issuer.yaml

    - name: Create keycloak ingress
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            name: keycloak-ingress
            namespace: "{{ NS }}"
            annotations:
              kubernetes.io/ingress.class: nginx
              nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
              nginx.ingress.kubernetes.io/proxy-buffer-size: "128k"
              cert-manager.io/issuer: "letsencrypt-keycloak"
          spec:
            tls:
            - hosts:
              - "keycloak.{{ ext_dns_name }}"
              secretName: keycloak-tls
            rules:
            - host: "keycloak.{{ ext_dns_name }}"
              http:
                paths:
                - pathType: Prefix
                  path: "/"
                  backend:
                    service:
                      name: keycloak
                      port:
                        number: 80
